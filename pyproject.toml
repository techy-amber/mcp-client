[project]
name = "mcp-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "techy-amber", email = "jainamber758@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "groq>=1.6.0",
    "mcp>=2.0.0",
    "mysql-connector-python>=26.7.0",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
]

[project.scripts]
mcp-client = "mcp_client:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
]
